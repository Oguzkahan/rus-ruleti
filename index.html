<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rus Ruleti">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Rus Ruleti – 2 Kişilik</title>
<style>
:root{--bg:#100d0b;--bone:#efe6d6;--steel:#a3abb3;--blood:#b3261e;--brass:#c9993a;--win:#2f7a4f;--line:#3a322b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:manipulation;overflow:hidden;overscroll-behavior:none}
.game{height:100%;display:flex;flex-direction:column;position:relative;user-select:none;-webkit-user-select:none}
.game.row{flex-direction:row}
.half{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;border:0;color:inherit;font:inherit;cursor:pointer;padding:12px;
background:radial-gradient(ellipse at 50% 40%,#2b221c 0%,#17120f 75%);transition:background .2s}
.game:not(.row) .half.p1{transform:rotate(180deg);border-bottom:3px solid var(--bg)}
.game.row .half.p1{border-right:3px solid var(--bg);padding-right:40px}
.game.row .half.p0{padding-left:40px}
.game:not(.row) .half{padding-top:54px}
.game:not(.row) .half.p1{padding-bottom:46px}
.half:active{filter:brightness(1.25)}
.name{font:700 20px Georgia,serif;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-size:14px;color:var(--steel);font-weight:700;display:flex;align-items:center;gap:8px}
.adj{width:34px;height:28px;border-radius:14px;background:#3a322b;color:var(--bone);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer}
.adj:active{background:var(--brass);color:#100d0b}
.risk{font-size:clamp(40px,min(13vw,8vh),96px);font-weight:900;letter-spacing:-2px;line-height:1;transition:color .3s}
.risk small{font-size:.26em;color:var(--steel);font-weight:600;letter-spacing:0;margin-left:8px}
.cyl{width:min(112px,13vh);height:min(112px,13vh);flex:none;filter:drop-shadow(0 6px 10px #000a)}
.cyl g.rot{transform-origin:60px 60px;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.hole{fill:#080605;stroke:var(--brass);stroke-width:3}
.hole.spent{stroke:#4a4038}
.msg{min-height:1.4em;color:var(--steel);font-size:16px;text-align:center}
.cta{font-weight:800;font-size:17px;color:var(--brass)}
.half.hot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 70px #b3261e99}}
.half.wait>*:not(.name){opacity:.4}
.half.dead{background:radial-gradient(ellipse at 50% 40%,#d03a2f,#7d130e 80%);cursor:default}
.half.won{background:radial-gradient(ellipse at 50% 40%,#3f9a68,#1f5236 80%);cursor:default}
.half.dead .cyl,.half.dead .cta,.half.won .cyl,.half.won .cta{display:none}
.half.dead .msg,.half.won .msg{color:var(--bone);font-size:18px;font-weight:700}
.half.dead .risk,.half.won .risk{color:var(--bone);font-size:clamp(44px,13vw,86px)}
.corner{position:absolute;top:8px;right:8px;z-index:6;display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:#3a322bdd;color:var(--bone);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px #0008}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.table{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:58px;height:82px;padding:0;border:0;background:none;cursor:pointer;perspective:300px}
.tcard{width:100%;height:100%;border-radius:9px;background:#f3ecdd;color:#1a1512;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px #000b,0 0 0 2px var(--brass);font-family:Georgia,serif;font-weight:900}
.tcard.red{color:#b3261e}
.tcard .big{font-size:36px;line-height:1}
.tcard .suit{font-size:15px;line-height:1;margin-top:2px}
.tcard small{font:700 9px "Trebuchet MS",sans-serif;opacity:.55;margin-top:3px}
.tcard.back{background:repeating-linear-gradient(45deg,#7d130e 0 6px,#5e0e0a 6px 12px);color:var(--bone)}
.tcard.flip{animation:flip .4s}
@keyframes flip{50%{transform:rotateY(90deg)}}
.shake{animation:sh .35s}
@keyframes sh{25%{translate:-8px 0}75%{translate:8px 0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.shake,#flash.go,.tcard.flip{animation:none}.half.hot{animation:none;box-shadow:inset 0 0 50px #b3261e88}.cyl g.rot{transition:none}}
.setup{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 0%,#2b221c,#100d0b 70%);display:flex;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.setup.hide{display:none}
.card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.card h1{margin:0;font:900 34px Georgia,serif}
.card p{margin:0;color:var(--steel);font-size:15px}
.card label,.card .lbl{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--steel);font-weight:700}
.card input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#1d1815;color:var(--bone);outline-offset:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:#1d1815;color:var(--bone);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.ic{display:block;margin:0 auto 6px;width:34px;height:34px;border:2px solid currentColor;border-radius:6px;position:relative}
.ic::after{content:"";position:absolute;background:currentColor}
.ic.tb::after{left:0;right:0;top:50%;height:2px;margin-top:-1px}
.ic.lr::after{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
.go{padding:16px;border:0;border-radius:14px;background:var(--brass);color:#100d0b;font:inherit;font-weight:900;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="game" id="game">
  <button class="half p1" id="h1" aria-label="1. oyuncu ateş et"></button>
  <button class="half p0" id="h0" aria-label="2. oyuncu ateş et"></button>
  <button class="table" id="table" aria-label="Masa kartı. Dokun, yeniden çek"><div class="tcard back" id="tcard"><span class="big">?</span><small>masa</small></div></button>
  <div class="corner">
    <button class="ib" id="again" aria-label="Yeni tur"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg></button>
    <button class="ib" id="settings" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#3a322b"/><circle cx="15" cy="12" r="2" fill="#3a322b"/><circle cx="8" cy="17" r="2" fill="#3a322b"/></svg></button>
  </div>
</div>
<div id="flash"></div>

<div class="setup" id="setup">
  <div class="card">
    <h1>Rus Ruleti</h1>
    <p>Liar’s Bar için ceza sayacı. Her atışta risk artar: 1/6, 1/5, 1/4… Ortadaki kart masayı seçer, dokununca yeniden çekersin.</p>
    <label>1. oyuncu (üst / sol)
      <input id="n1" maxlength="12" placeholder="Oyuncu 1" autocomplete="off">
    </label>
    <label>2. oyuncu (alt / sağ)
      <input id="n2" maxlength="12" placeholder="Oyuncu 2" autocomplete="off">
    </label>
    <div class="lbl">Ekran
      <div class="seg" role="group" aria-label="Ekran bölünmesi">
        <button type="button" id="optTB" aria-pressed="true"><span class="ic tb"></span>Alt – üst</button>
        <button type="button" id="optLR" aria-pressed="false"><span class="ic lr"></span>Yan yana</button>
      </div>
    </div>
    <div class="lbl">Oyun şekli
      <div class="seg" role="group" aria-label="Oyun şekli">
        <button type="button" id="optSim" aria-pressed="true">Aynı anda</button>
        <button type="button" id="optTurn" aria-pressed="false">Sırayla</button>
      </div>
    </div>
    <button class="go" id="go">Başla</button>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
var game=$('game'), setup=$('setup'), flash=$('flash');
var halves=[$('h0'),$('h1')];
var names=['Oyuncu 2','Oyuncu 1']; // 0 = alt/sağ, 1 = üst/sol
var sel={lr:false,turnMode:false};
var wins=[0,0], els=[], left, over, msgs, rot, turn, endAt=0;
var COLS={6:'#c9993a',5:'#d28a31',4:'#d9702b',3:'#dd5724',2:'#e03c1f',1:'#ec1f18'};
var TABLE=[['K','♠',0],['Q','♥',1],['A','♦',1],['J','♣',0]], tbl=null;
function drawTable(){
  var c=$('tcard'), n=0;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(t){c.className='tcard'+(t[2]?' red':'');c.innerHTML='<span class="big">'+t[0]+'</span><span class="suit">'+t[1]+'</span><small>masa</small>';}
  var final=TABLE[Math.floor(Math.random()*4)];
  clearInterval(tbl);
  if(reduce){show(final);return;}
  tbl=setInterval(function(){
    n++;
    if(n>=8){clearInterval(tbl);show(final);c.classList.add('flip');return;}
    show(TABLE[n%4]);
  },70);
}

function cylSvg(){
  var s='<svg class="cyl" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="g" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#9aa3ab"/><stop offset="1" stop-color="#3b4249"/></radialGradient></defs><g class="rot"><circle cx="60" cy="60" r="57" fill="url(#g)" stroke="#20252a" stroke-width="2"/>';
  for(var k=0;k<6;k++){
    var a=k*Math.PI/3;
    s+='<circle class="hole" cx="'+(60+35*Math.sin(a)).toFixed(1)+'" cy="'+(60-35*Math.cos(a)).toFixed(1)+'" r="12"/>';
  }
  return s+'<circle cx="60" cy="60" r="9" fill="#20252a"/></g></svg>';
}
function build(i){
  halves[i].innerHTML='<div class="name"></div><div class="score"><span class="adj" role="button" aria-label="Galibiyeti azalt" data-d="-1">−</span><span class="sv"></span><span class="adj" role="button" aria-label="Galibiyeti artır" data-d="1">+</span></div><div class="risk"></div>'+cylSvg()+'<div class="msg"></div><div class="cta"></div>';
  var h=halves[i];
  els[i]={name:h.querySelector('.name'),sv:h.querySelector('.sv'),risk:h.querySelector('.risk'),
    rot:h.querySelector('.rot'),holes:h.querySelectorAll('.hole'),msg:h.querySelector('.msg'),cta:h.querySelector('.cta')};
}
function update(i){
  var e=els[i], h=halves[i], l=left[i];
  var waiting=sel.turnMode&&over===null&&turn!==i;
  h.className='half p'+i+(over===i?' dead':(over!==null?' won':''))+(waiting?' wait':'')+((over===null&&l<=2)?' hot':'');
  e.name.textContent=names[i];
  e.sv.textContent='Galibiyet: '+wins[i];
  if(over===i){e.risk.textContent='BANG';e.msg.textContent=names[i]+' vuruldu. Yeni tur için dokun.';e.risk.style.color='';}
  else if(over!==null){e.risk.textContent='Kazandı';e.msg.textContent='Rakip vuruldu. Yeni tur için dokun.';e.risk.style.color='';}
  else{
    e.risk.innerHTML='1/'+l+'<small>risk</small>';
    e.risk.style.color=COLS[l];
    e.msg.textContent=msgs[i];
    e.cta.textContent=waiting?'Sıra rakipte':'Ateş et';
  }
  for(var k=0;k<6;k++) e.holes[k].setAttribute('class','hole'+(k<6-l?' spent':''));
  e.rot.style.transform='rotate('+rot[i]+'deg)';
}
function start(){
  left=[6,6];over=null;rot=[0,0];msgs=['Tetiğe bas.','Tetiğe bas.'];
  turn=Math.random()<.5?0:1;
  if(sel.turnMode) msgs[turn]='Önce sen başla.';
  for(var i=0;i<2;i++){
    var g=els[i].rot; g.style.transition='none'; update(i); void g.getBoundingClientRect(); g.style.transition='';
  }
  drawTable();
}
function fire(i){
  if(over!==null){ if(Date.now()-endAt>700) start(); return; }
  if(sel.turnMode&&turn!==i) return;
  if(Math.random()<1/left[i]){
    over=i; wins[1-i]++; endAt=Date.now();
    try{navigator.vibrate&&navigator.vibrate([200,60,200])}catch(e){}
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    update(0);update(1);
  }else{
    left[i]--; rot[i]+=60;
    msgs[i]='Boş. Sıradaki risk 1/'+left[i];
    if(sel.turnMode){turn=1-i; msgs[turn]='Sıra sende.';}
    try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
    update(0);update(1);
    halves[i].classList.remove('shake'); void halves[i].offsetWidth; halves[i].classList.add('shake');
  }
}
function pick(a,b,key,val){
  a.addEventListener('click',function(){sel[key]=!val;a.setAttribute('aria-pressed','true');b.setAttribute('aria-pressed','false');});
  b.addEventListener('click',function(){sel[key]=val;b.setAttribute('aria-pressed','true');a.setAttribute('aria-pressed','false');});
}
pick($('optTB'),$('optLR'),'lr',true);
pick($('optSim'),$('optTurn'),'turnMode',true);
$('go').addEventListener('click',function(){
  names[1]=$('n1').value.trim()||'Oyuncu 1';
  names[0]=$('n2').value.trim()||'Oyuncu 2';
  wins=[0,0];
  game.classList.toggle('row',sel.lr);
  setup.classList.add('hide');
  start();
});
$('settings').addEventListener('click',function(){setup.classList.remove('hide')});
$('again').addEventListener('click',start);
$('table').addEventListener('click',drawTable);
function onHalf(i){return function(ev){
  var a=ev.target.closest&&ev.target.closest('.adj');
  if(a){wins[i]=Math.max(0,wins[i]+Number(a.getAttribute('data-d')));update(i);return;}
  fire(i);
};}
halves[0].addEventListener('click',onHalf(0));
halves[1].addEventListener('click',onHalf(1));
build(0);build(1);start();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
var wl=null;
function keepAwake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null});}).catch(function(){});}catch(e){}}
document.addEventListener('click',keepAwake);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')keepAwake();});
</script>
</body>
</html>
